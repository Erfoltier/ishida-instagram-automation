name: Publish approved Instagram reel

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    # Same pattern as publish.yml: the exact "approve" match happens inside the
    # script, which exits 0 as a no-op for any other comment.
    if: >
      contains(github.event.issue.labels.*.name, 'instagram-reel') &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsx scripts/publish-approved-reel.ts
        env:
          # Passed as env vars, never interpolated into the shell command line: this
          # repo is public, so github.event.comment.body is attacker-controlled input.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_IG_PROFESSIONAL_ACCOUNT_ID: ${{ secrets.META_IG_PROFESSIONAL_ACCOUNT_ID }}
      - run: |
          git config user.name "ishida-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reel-history.json
          git diff --cached --quiet || git commit -m "publish reel: issue #${{ github.event.issue.number }}"
          git pull --rebase
          git push
