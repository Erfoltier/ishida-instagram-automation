name: Generate Instagram reel

on:
  schedule:
    - cron: "0 1 * * 3" # Wed 10:00 JST
  workflow_dispatch:
    inputs:
      theme_subject:
        description: "記事ID（例: M1-01）またはsubjectと完全一致させる。空欄なら次の未公開記事を順番に自動選定（症例記事は対象外）"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # No CJK font install needed here: the Remotion template bundles its own
      # Japanese fonts (remotion/fonts.ts), and Remotion downloads its own
      # headless Chromium on first render.
      - id: generate
        run: npm run generate-reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEME_SUBJECT: ${{ inputs.theme_subject }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "ishida-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels
          git diff --cached --quiet || git commit -m "reel: ${{ steps.generate.outputs.reel_id }}"
          git pull --rebase
          git push
      - run: npx tsx scripts/create-reel-issue.ts "${{ steps.generate.outputs.reel_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
