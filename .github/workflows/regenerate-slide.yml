name: Regenerate slide text

on:
  workflow_dispatch:
    inputs:
      draft_id:
        required: true
        type: string
      slide_order:
        required: true
        type: string
      slide_title:
        required: true
        type: string
      slide_body:
        required: true
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Headline/price text is Shippori Mincho, with Noto Serif CJK JP as the
      # fallback for glyphs it doesn't cover — apt's fonts-noto-cjk is Sans-only.
      - run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          sudo mkdir -p /usr/share/fonts/opentype/noto-serif-cjk /usr/share/fonts/truetype/shippori-mincho
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Regular.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Bold.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Bold.otf
          sudo curl -fsSL -o /usr/share/fonts/truetype/shippori-mincho/ShipporiMincho-Regular.ttf https://github.com/google/fonts/raw/main/ofl/shipporimincho/ShipporiMincho-Regular.ttf
          sudo curl -fsSL -o /usr/share/fonts/truetype/shippori-mincho/ShipporiMincho-Bold.ttf https://github.com/google/fonts/raw/main/ofl/shipporimincho/ShipporiMincho-Bold.ttf
          sudo curl -fsSL -o /usr/share/fonts/truetype/shippori-mincho/ShipporiMincho-ExtraBold.ttf https://github.com/google/fonts/raw/main/ofl/shipporimincho/ShipporiMincho-ExtraBold.ttf
          fc-cache -f
      - run: npx tsx scripts/regenerate-slide.ts
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
          SLIDE_ORDER: ${{ inputs.slide_order }}
          SLIDE_TITLE: ${{ inputs.slide_title }}
          SLIDE_BODY: ${{ inputs.slide_body }}
      - run: |
          git config user.name "ishida-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts
          git diff --cached --quiet || git commit -m "edit: ${{ inputs.draft_id }} slide ${{ inputs.slide_order }}"
          git push
