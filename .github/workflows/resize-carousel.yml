name: Resize carousel (add/remove a page)

on:
  workflow_dispatch:
    inputs:
      draft_id:
        required: true
        type: string
      action:
        required: true
        type: string
      position:
        required: true
        type: string

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # On-image text is Noto Serif JP (Mincho); apt's fonts-noto-cjk is Sans-only.
      - run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          sudo mkdir -p /usr/share/fonts/opentype/noto-serif-cjk
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Regular.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Bold.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Bold.otf
          fc-cache -f
      - run: npx tsx scripts/resize-carousel.ts
        env:
          DRAFT_ID: ${{ inputs.draft_id }}
          ACTION: ${{ inputs.action }}
          POSITION: ${{ inputs.position }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "ishida-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts
          git diff --cached --quiet || git commit -m "resize: ${{ inputs.draft_id }} ${{ inputs.action }} @ ${{ inputs.position }}"
          git push
