name: Generate Instagram draft

on:
  schedule:
    - cron: "0 1 * * 2,4,6" # Tue/Thu/Sat 10:00 JST
  workflow_dispatch:
    inputs:
      theme_subject:
        description: "記事ID（例: M1-01）またはsubjectと完全一致させる。空欄なら次の未公開記事を順番に自動選定"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # ubuntu-latest ships no CJK fonts. Headline/price text is Shippori Mincho
      # (matching the clinic's actual Instagram template's brush-serif display
      # face) with Noto Serif CJK JP as the fallback for glyphs it doesn't cover
      # — apt's fonts-noto-cjk is Sans-only, so fetch the Serif OTF directly too.
      - run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          sudo mkdir -p /usr/share/fonts/opentype/noto-serif-cjk /usr/share/fonts/truetype/shippori-mincho
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Regular.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Bold.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Bold.otf
          sudo curl -fsSL -o /usr/share/fonts/truetype/shippori-mincho/ShipporiMincho-Regular.ttf https://github.com/google/fonts/raw/main/ofl/shipporimincho/ShipporiMincho-Regular.ttf
          sudo curl -fsSL -o /usr/share/fonts/truetype/shippori-mincho/ShipporiMincho-Bold.ttf https://github.com/google/fonts/raw/main/ofl/shipporimincho/ShipporiMincho-Bold.ttf
          sudo curl -fsSL -o /usr/share/fonts/truetype/shippori-mincho/ShipporiMincho-ExtraBold.ttf https://github.com/google/fonts/raw/main/ofl/shipporimincho/ShipporiMincho-ExtraBold.ttf
          fc-cache -f
      - id: generate
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEME_SUBJECT: ${{ inputs.theme_subject }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "ishida-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts data
          git diff --cached --quiet || git commit -m "draft: ${{ steps.generate.outputs.draft_id }}"
          git push
      - run: npx tsx scripts/create-issue.ts "${{ steps.generate.outputs.draft_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
