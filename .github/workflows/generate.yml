name: Generate Instagram draft

on:
  schedule:
    - cron: "0 1 * * 2,6" # Tue/Sat 10:00 JST
  workflow_dispatch:
    inputs:
      theme_subject:
        description: "記事ID（例: M1-01）またはsubjectと完全一致させる。空欄なら次の未公開記事を順番に自動選定"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # ubuntu-latest ships no CJK fonts. All on-image text is Noto Serif JP (Mincho)
      # per the brand redesign — apt's fonts-noto-cjk package is Sans-only, so fetch
      # the actual Serif OTF directly rather than risk silent tofu/mojibake.
      - run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          sudo mkdir -p /usr/share/fonts/opentype/noto-serif-cjk
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Regular.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Regular.otf
          sudo curl -fsSL -o /usr/share/fonts/opentype/noto-serif-cjk/NotoSerifCJKjp-Bold.otf https://github.com/googlefonts/noto-cjk/raw/main/Serif/OTF/Japanese/NotoSerifCJKjp-Bold.otf
          fc-cache -f
      - id: generate
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEME_SUBJECT: ${{ inputs.theme_subject }}
      - run: |
          git config user.name "ishida-instagram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drafts data
          git diff --cached --quiet || git commit -m "draft: ${{ steps.generate.outputs.draft_id }}"
          git push
      - run: npx tsx scripts/create-issue.ts "${{ steps.generate.outputs.draft_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
